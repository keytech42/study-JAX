name: Deploy MkDocs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Cache mkdocs-jupyter execution results
        uses: actions/cache@v4
        with:
          path: .cache/mkdocs-jupyter
          key: mkdocs-jupyter-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            mkdocs-jupyter-${{ github.ref }}-
            mkdocs-jupyter-

      - name: Deploy to GitHub Pages
        run: uv run mkdocs gh-deploy --force
